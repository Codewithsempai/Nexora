<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NEXORA Reminder</title><link rel="stylesheet" href="styles/reminder-alert.css"></head>
<body><main class="card" id="card">
<div class="head"><span class="bell">⏰</span><span class="label">REMINDER</span><span class="more" id="more"></span></div>
<div class="text" id="text"></div>
<div class="actions"><button type="button" id="done" class="primary">Done</button><button type="button" id="snooze">Snooze 10 min</button></div>
<button type="button" id="close" class="x" aria-label="Dismiss" title="Dismiss">×</button></main>
<script src="reminder-alert.js"></script></body></html>
